<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><rect width="1100" height="510" rx="18" fill="#f2f5ef"/><g font-family="Arial,sans-serif" fill="#24342d"><text x="45" y="55" font-size="25" font-weight="700">Giải nén: biến tệp ZIP thành thư mục để sử dụng</text><text x="45" y="87" font-size="17" fill="#53655a">Sơ đồ minh họa • Tên và vị trí nút có thể khác theo máy</text>
<rect x="45" y="125" width="480" height="205" rx="12" fill="#fff" stroke="#b8cabd"/><text x="70" y="164" font-size="22" font-weight="700">Trên Windows</text><text x="70" y="205" font-size="18">1. Chuột phải vào tệp .zip</text><text x="70" y="246" font-size="18">2. Extract All / Giải nén tất cả</text><text x="70" y="287" font-size="18">3. Chọn nơi lưu → Extract / Giải nén</text>
<rect x="575" y="125" width="480" height="205" rx="12" fill="#fff" stroke="#b8cabd"/><text x="600" y="164" font-size="22" font-weight="700">Trên Mac</text><text x="600" y="205" font-size="18">1. Bấm đúp vào tệp .zip</text><text x="600" y="246" font-size="18">2. Thư mục xuất hiện bên cạnh</text><text x="600" y="287" font-size="18">3. Mở thư mục vừa tạo</text>
<rect x="45" y="362" width="1010" height="109" rx="12" fill="#24644e"/><text x="70" y="401" font-size="20" font-weight="700" fill="#fff">Đúng chỗ khi bạn thấy: README.md • inputs • outputs • skills • workflows</text><text x="70" y="441" font-size="18" fill="#e7f1e8">Nếu còn một thư mục lồng bên trong, mở tiếp. Không đặt tài liệu vào trong ZIP.</text></g></svg>
