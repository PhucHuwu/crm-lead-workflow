<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><rect width="1100" height="510" rx="18" fill="#f2f5ef"/><g font-family="Arial,sans-serif" fill="#24342d"><text x="45" y="55" font-size="25" font-weight="700">Mở đúng chế độ: Code → Local → Select folder</text><text x="45" y="88" font-size="17" fill="#53655a">Sơ đồ hướng dẫn • Không phải ảnh chụp giao diện Desktop</text><rect x="45" y="130" width="1010" height="100" rx="12" fill="#fff" stroke="#b8cabd"/><text x="75" y="172" font-size="20">1. Trong Claude Desktop</text><text x="75" y="209" font-size="24" font-weight="700" fill="#24644e">Chọn tab Code</text><rect x="45" y="250" width="480" height="110" rx="12" fill="#fff" stroke="#b8cabd"/><text x="75" y="289" font-size="20">2. Môi trường</text><text x="75" y="329" font-size="24" font-weight="700" fill="#24644e">Local — trên máy bạn</text><rect x="575" y="250" width="480" height="110" rx="12" fill="#fff" stroke="#b8cabd"/><text x="605" y="289" font-size="20">3. Select folder</text><text x="605" y="329" font-size="24" font-weight="700" fill="#24644e">Thư mục workflow đã giải nén</text><text x="45" y="410" font-size="19">Đúng thư mục khi thấy: CLAUDE.md • inputs • outputs • .claude</text><text x="45" y="455" font-size="17" fill="#53655a">Bắt đầu với Manual để duyệt thao tác. Không cần mở Project trong tab Chat.</text></g></svg>
