<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" rx="18" fill="#f2f5ef"/><g font-family="Arial,sans-serif" fill="#24342d"><text x="45" y="55" font-size="25" font-weight="700">Sau khi gửi email, theo dõi điều gì?</text><text x="45" y="87" font-size="17" fill="#53655a">Sơ đồ quy trình • Cần công cụ gửi và đọc thư thực tế</text><rect x="45" y="215" width="260" height="100" rx="12" fill="#24644e"/><text x="70" y="254" font-size="21" fill="#fff" font-weight="700">Kiểm tra hộp thư</text><text x="70" y="287" font-size="17" fill="#e7f1e8">Đối chiếu đúng khách</text><path d="M305 265H365V165H420M365 265H420M365 265V365H420" fill="none" stroke="#758c7b" stroke-width="3"/><rect x="420" y="120" width="625" height="85" rx="12" fill="#fff" stroke="#b8cabd"/><text x="445" y="154" font-size="20" font-weight="700">Khách trả lời → Dừng chuỗi email</text><text x="445" y="183" font-size="17">Ghi nhận phản hồi, tạo việc cho người phụ trách</text><rect x="420" y="230" width="625" height="85" rx="12" fill="#fff" stroke="#b8cabd"/><text x="445" y="264" font-size="20" font-weight="700">Yêu cầu ngừng liên hệ → Ngừng gửi</text><text x="445" y="293" font-size="17">Cập nhật trạng thái, không tiếp tục chăm sóc</text><rect x="420" y="340" width="625" height="85" rx="12" fill="#fff" stroke="#b8cabd"/><text x="445" y="374" font-size="20" font-weight="700">Chưa trả lời → Tiếp tục đúng kế hoạch</text><text x="445" y="403" font-size="17">Chỉ kết thúc sau toàn bộ chuỗi và thời gian chờ</text><text x="45" y="492" font-size="18" fill="#53655a">Thư nghỉ phép và thư bị trả lại được xử lý riêng, không coi là khách có nhu cầu.</text></g></svg>
